# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4.
version: "v0.4"

project:
  name: "Krohn–Rhodes decomposition of finite monoids into aperiodic and simple-group factors"
  description: >-
    A Lean 4 and Mathlib formalization of the Krohn–Rhodes prime decomposition
    theorem for finite monoids, in a form with aperiodic factors: every finite
    monoid M divides an iterated wreath product of finite monoids, each of which
    is aperiodic or a simple group, and every simple group among the factors
    divides M. The proof follows the local-divisor proof of Diekert, Kufleitner
    and Steinberg. Unlike the classical statement, the aperiodic factors are not
    reduced to copies of the three-element flip-flop monoid U₂; for an aperiodic
    M the statement holds with M as its only factor, and in general it separates
    the group structure of M, as simple groups dividing M, from aperiodic
    factors.
  authors:
    - "Aditya Rao"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Aditya Rao"

classification:
  arxiv: ["math.GR", "cs.FL"]
  msc2020: ["20M10", "20M35", "20M20", "68Q70"]

sources:
  - title: "Algebraic theory of machines. I. Prime decomposition theorem for finite semigroups and machines"
    authors:
      - "Kenneth Krohn"
      - "John Rhodes"
    id: "https://doi.org/10.1090/S0002-9947-1965-0188316-1"
    type: "paper"
    location: "Transactions of the American Mathematical Society 116 (1965), 450–464"
    relationship: "adapts"
    note: >-
      The original theorem: every finite semigroup divides an iterated wreath
      product of finite simple groups that divide it and copies of the flip-flop
      monoid. The formal statement is for finite monoids and allows arbitrary
      finite aperiodic monoids in place of copies of the flip-flop. The proof is
      that of the second source, not the original one.
  - title: "The Krohn-Rhodes Theorem and Local Divisors"
    authors:
      - "Volker Diekert"
      - "Manfred Kufleitner"
      - "Benjamin Steinberg"
    id: "arXiv:1111.1585v1"
    type: "paper"
    location: "Fundamenta Informaticae 116 (2012), 65–77; https://doi.org/10.3233/FI-2012-669"
    relationship: "adapts"
    note: >-
      Theorem numbers refer to arXiv:1111.1585v1. The Lean proof follows
      Theorem 3.1 (a decomposition through the local divisor at a generator c),
      Corollary 3.2 (with a minimal generating set and a non-unit c, induction on
      the size of the monoid, down to groups with the constant maps adjoined),
      and, as in the proof of Theorem 4.1, Lemma 2.9 (such a group divides a
      reset monoid wreath the group) and Corollary 2.8 (a finite group divides a
      wreath product of simple groups that divide it, with Proposition 2.7
      replaced by the Krasner–Kaloujnine embedding). It is written for left
      instead of right actions, takes the local divisor on cM ∩ Mc rather than
      cMc ∪ {c} (the paper notes that both work), and joins towers by
      associativity of the wreath product up to division. The formal statement
      is Theorem 4.1 at the level of monoids, with semigroup division, and
      without its last step (Lemma 2.10 and Example 2.4), which replaces the
      reset monoids by copies of U₂. The size bounds of Corollaries 3.2 and 4.2
      are not formalized.

related_formalizations: []

status:
  scope: >-
    Formalized, with no sorry: for every finite monoid M in Type, a list of
    finite monoids, each aperiodic (every H-class is a singleton) or a simple
    group, such that M divides the right-iterated wreath product of the list
    (with semigroup division, one level at a time, each level acting on a finite
    type) and every simple-group factor divides M as a monoid. Not formalized:
    the reduction of the aperiodic factors to copies of the flip-flop monoid U₂;
    finite semigroups that are not monoids; monoids in universes other than
    Type; bounds on the size of the decomposition.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

