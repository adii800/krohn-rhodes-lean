        - "Claude Opus 4.7 (1M context)"
        - "Claude Opus 4.8 (1M context)"
        - "Claude Fable 5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code agents wrote the Lean definitions, statements and proofs
        between April and June 2026, under the direction of Aditya Rao. The
        models listed are those named in the Co-Authored-By trailers of the
        development's commit history, which is not part of this repository. Some
        commits in that history, including the ones that completed the main
