        Claude Code agents; only the model used for them was not recorded.
    - method: "agent"
      models:
        - "Claude Opus 5.5"
      framework: "Claude Code"
      tool_setup: >-
        In September 2026 a Claude Code agent extracted the theorem and its
        dependencies into this repository, revised the documentation, ported the
        code from Lean 4.28.0 to Lean 4.35.0-rc2 without changing the meaning of
        any statement,
        split it into Challenge and Solution modules, and wrote this file. A
        separate Claude Code session of the same model then reviewed the
        documentation (see review), and the issues it reported were corrected.
  notes: >-
    Aditya Rao directed the work and is responsible for the submission. The
    proofs were written by AI agents and are checked by Lean's kernel.

fidelity:
  divergences: >-
    (1) The aperiodic factors are arbitrary finite aperiodic monoids rather than
    copies of the flip-flop monoid U₂. The proof produces reset monoids (the
    identity together with all constant maps on a finite set), each of which
    embeds in a direct power of U₂, but that step is not formalized; for an
    aperiodic M the formal statement holds with M as its only factor. (2) The
    statement is for finite monoids in Type, not for finite semigroups. (3) The
    tower is stated with semigroup division (a homomorphic image of a
    subsemigroup), one level at a time: M divides F₁ ≀ B₁ for a finite monoid
    B₁ acting on a finite set, B₁ divides F₂ ≀ B₂, and so on, with the last
    base trivial. This is equivalent to M dividing a single iterated wreath
    product F₁ ≀ (F₂ ≀ (⋯ ≀ (Fₖ ≀ 1))) with suitable finite actions, but the
    equivalence is not formalized. Diekert, Kufleitner and Steinberg state the
    theorem for transformation monoids and strong division. (4) The simple-group
    factors divide M as monoids (each is a quotient of a submonoid of M). (5)
    Wreath products are written for left actions,
    (f, a)(g, b) = (x ↦ f(b·x) g(x), ab), the mirror image of the right-action
    convention of the source.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (a separate Claude Code session; the same model revised the documentation)"
  notes: >-
    A separate Claude Code session (Claude Opus 5.5, the model that also
    revised the documentation) checked every docstring, the README and this
    file against the Lean statements and arXiv:1111.1585v1; the 1965 paper was
    not consulted. The issues it reported were corrected. Mechanical checks run
    before submission: the build; an axiom audit (propext, Classical.choice and
    Quot.sound only); leanchecker on every module; and Comparator on
    comparator.json, with Lean's kernel, NanoDa and con-ron, and in a separate
    run also lean4lean, con-leche and leanchecker-paranoid. The CI workflow
    reruns Comparator on every push to main and on every pull request. No
    independent human review has been performed.

alignment:
  namespace: "KrohnRhodes"
  statements:
    - source: "Krohn–Rhodes (1965), prime decomposition theorem; Diekert–Kufleitner–Steinberg, Theorem 4.1"
      lean: "KrohnRhodes.krohn_rhodes_prime_decomposition"
      module: "Challenge"
      status: "adapted"
      note: >-
        Proved in Solution without sorry. The decomposition is stated for
        finite monoids, with arbitrary finite aperiodic factors in place of
        copies of U₂; see fidelity.divergences.

